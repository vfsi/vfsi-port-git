name: Test VFSI public package integration

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ vfsi ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: VNFS 0.0.11 / VFSI C ABI v3
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev libkrb5-dev \
            liburcu-dev make patch
      - name: Build VFSI from public crates
        run: contrib/vfsi/build-vfsi-c
      - name: Build Git with VFSI
        run: |
          make -j2 USE_VFSI=YesPlease \
            VFSI_CFLAGS="-I$PWD/build-vfsi-c/vfsi-c-0.3.0-vnfs-0.0.11/source/include" \
            NO_CURL=YesPlease NO_GETTEXT=YesPlease NO_TCLTK=YesPlease git
      - name: Smoke test the public VFSI library
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          git -C "$fixture" init --quiet
          git -C "$fixture" config user.email vfsi-ci@example.invalid
          git -C "$fixture" config user.name "VFSI CI"
          printf 'vfsi public package smoke\n' >"$fixture/input"
          git -C "$fixture" add input
          git -C "$fixture" commit --quiet -m smoke
          VFSI_IMPL=dummy \
          VFSI_LIBRARY="$PWD/build-vfsi-c/vfsi-c-0.3.0-vnfs-0.0.11/target/release/libvfsi_c.so" \
          VFSI_ROOT="$fixture" \
          VFSI_MOUNT="$fixture" \
            ./git -C "$fixture" count-objects -v >/dev/null
