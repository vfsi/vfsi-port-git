name: Test VFSI public package integration

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ vfsi ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The public native dependency builds pinned ntirpc source.
    runs-on: ubuntu-26.04
    name: Published VFSI SDK / C ABI v3
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev \
            libkrb5-dev liburcu-dev make pkg-config
      - name: Build VFSI from public crates
        id: sdk
        run: contrib/vfsi/build-vfsi-c
      - name: Build Git with VFSI
        env:
          VFSI_INCLUDE: ${{ steps.sdk.outputs.include }}
        run: |
          make -j2 USE_VFSI=YesPlease \
            VFSI_CFLAGS="-I$VFSI_INCLUDE" \
            NO_CURL=YesPlease NO_GETTEXT=YesPlease NO_TCLTK=YesPlease git
      - name: Smoke test the public VFSI library
        env:
          VFSI_LIBRARY: ${{ steps.sdk.outputs.library }}
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          git -C "$fixture" init --quiet
          git -C "$fixture" config user.email vfsi-ci@example.invalid
          git -C "$fixture" config user.name "VFSI CI"
          printf 'vfsi public package smoke\n' >"$fixture/input"
          git -C "$fixture" add input
          git -C "$fixture" commit --quiet -m smoke
          VFSI_IMPL=dummy \
          VFSI_ROOT="$fixture" \
          VFSI_MOUNT="$fixture" \
            ./git -C "$fixture" count-objects -v >/dev/null
      - name: Verify bounded prefetch and application parity
        env:
          VFSI_LIBRARY: ${{ steps.sdk.outputs.library }}
          VFSI_INCLUDE: ${{ steps.sdk.outputs.include }}
        run: sh contrib/vfsi/test-port.sh
